name: caja_segura
description: Caja Segura Local (Vault) - Flutter
publish_to: "none"

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Storage & security
  biometric_storage: ^5.0.1
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  path_provider: ^2.1.4
  # flutter_windowmanager: ^0.2.0  # Comentado temporalmente por problemas de compatibilidad
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI & utils
  collection: ^1.18.0
  intl: ^0.19.0
  uuid: ^4.5.1
  file_picker: ^8.1.2
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
