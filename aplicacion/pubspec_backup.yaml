name: caja_segura
description: Caja Segura Local (Vault) - Flutter
publish_to: "none"

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Storage & files
  path_provider: ^2.1.3
  file_picker: ^8.0.0
  share_plus: ^10.0.2

  # Security & crypto
  biometric_storage: ^5.0.1
  cryptography: ^2.6.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.1.8

  # UI & utils
  collection: ^1.18.0
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_windowmanager: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
